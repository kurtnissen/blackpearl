name: blackpearl-torbox

services:
  blackpearl:
    image: blackpearl:torbox
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      BLACKPEARL_DATA_DIR: /var/lib/blackpearl
      BLACKPEARL_DB_PATH: /var/lib/blackpearl/blackpearl.db
      BLACKPEARL_CACHE_DIR: /var/lib/blackpearl/cache
      BLACKPEARL_MOUNT_PATH: /mnt/blackpearl
      BLACKPEARL_HTTP_ADDR: :8080
      BLACKPEARL_LOG_LEVEL: ${BLACKPEARL_LOG_LEVEL:-info}
      BLACKPEARL_STORAGE_MODE: ${BLACKPEARL_STORAGE_MODE:-rolling}
      BLACKPEARL_CACHE_MAX_BYTES: ${BLACKPEARL_CACHE_MAX_BYTES:-42949672960}
      BLACKPEARL_CACHE_CHUNK_BYTES: ${BLACKPEARL_CACHE_CHUNK_BYTES:-1048576}
      BLACKPEARL_CACHE_READ_AHEAD_CHUNKS: ${BLACKPEARL_CACHE_READ_AHEAD_CHUNKS:-8}
      BLACKPEARL_CACHE_NEXT_EPISODE_CHUNKS: ${BLACKPEARL_CACHE_NEXT_EPISODE_CHUNKS:-16}
      BLACKPEARL_RANGE_PROVIDER: torbox-torrent
      BLACKPEARL_RANGE_TIMEOUT: ${BLACKPEARL_RANGE_TIMEOUT:-30s}
      BLACKPEARL_ACQUISITION_OPERATION_TIMEOUT: ${BLACKPEARL_ACQUISITION_OPERATION_TIMEOUT:-2m}
      BLACKPEARL_OPEN_MEDIA_SEARCH_ENABLED: ${BLACKPEARL_OPEN_MEDIA_SEARCH_ENABLED:-true}
      BLACKPEARL_OPEN_MEDIA_SEARCH_URL: https://archive.org/
      BLACKPEARL_TORBOX_API_URL: https://api.torbox.app/v1/api/
      BLACKPEARL_SETUP_ENABLED: "true"
      BLACKPEARL_SETUP_DIR: /var/lib/blackpearl/setup
      BLACKPEARL_SETUP_BOOTSTRAP_TOKEN: ${BLACKPEARL_SETUP_BOOTSTRAP_TOKEN:?Run ./scripts/torbox-stack.sh start}
      BLACKPEARL_WATCHLIST_ENABLED: "true"
      BLACKPEARL_WATCHLIST_PREFERENCES_PATH: /plex-config/Library/Application Support/Plex Media Server/Preferences.xml
      BLACKPEARL_WATCHLIST_POLL_INTERVAL: ${BLACKPEARL_WATCHLIST_POLL_INTERVAL:-15m}
      BLACKPEARL_WATCHLIST_ACQUISITION_ENABLED: ${BLACKPEARL_WATCHLIST_ACQUISITION_ENABLED:-false}
      BLACKPEARL_WATCHLIST_RECONCILE_INTERVAL: ${BLACKPEARL_WATCHLIST_RECONCILE_INTERVAL:-30s}
      BLACKPEARL_PLEX_REFRESH_ENABLED: "true"
      BLACKPEARL_PLEX_REFRESH_URL: ${BLACKPEARL_PLEX_REFRESH_URL:-http://host.docker.internal:32402}
      BLACKPEARL_PLAYBACK_ADVANCEMENT_ENABLED: "true"
      BLACKPEARL_PLAYBACK_POLL_INTERVAL: ${BLACKPEARL_PLAYBACK_POLL_INTERVAL:-30s}
      BLACKPEARL_PLAYBACK_OPERATION_TIMEOUT: ${BLACKPEARL_PLAYBACK_OPERATION_TIMEOUT:-15s}
      BLACKPEARL_PLAYBACK_METADATA_URL: https://metadata.provider.plex.tv
      BLACKPEARL_FILESYSTEM_MODE: nfs
      BLACKPEARL_NFS_ADDR: 0.0.0.0:2049
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${BLACKPEARL_TORBOX_HTTP_PORT:-8082}:8080/tcp
      - 127.0.0.1:${BLACKPEARL_TORBOX_NFS_PORT:-20492}:2049/tcp
    volumes:
      - blackpearl-data:/var/lib/blackpearl
      - plex-config:/plex-config:ro
    networks:
      - blackpearl-control
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/healthz]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
    ports:
      - 127.0.0.1:${BLACKPEARL_PROWLARR_PORT:-9697}:9696/tcp
    volumes:
      - prowlarr-config:/config
    networks:
      - blackpearl-control
    security_opt:
      - no-new-privileges:true

  plex:
    image: plexinc/pms-docker:1.43.0.10492-121068a07
    restart: unless-stopped
    depends_on:
      blackpearl:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      PLEX_CLAIM: ${PLEX_TORBOX_CLAIM:-}
      ADVERTISE_IP: ${PLEX_TORBOX_ADVERTISE_IP:-http://localhost:32402/}
    ports:
      - 127.0.0.1:${PLEX_TORBOX_PORT:-32402}:32400/tcp
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - blackpearl-library:/blackpearl:ro
    networks:
      - plex-runtime
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:32400/identity]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s

volumes:
  blackpearl-data:
  plex-config:
  plex-transcode:
  prowlarr-config:
  blackpearl-library:
    driver: local
    driver_opts:
      type: nfs
      device: :/
      o: addr=127.0.0.1,vers=3,tcp,nolock,actimeo=1,lookupcache=none,port=${BLACKPEARL_TORBOX_NFS_PORT:-20492},mountport=${BLACKPEARL_TORBOX_NFS_PORT:-20492},ro

networks:
  blackpearl-control:
  plex-runtime:
