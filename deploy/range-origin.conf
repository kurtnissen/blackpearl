worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format ranges '$remote_addr "$request" $status $body_bytes_sent range="$http_range"';
    access_log /dev/stdout ranges;
    include /etc/nginx/mime.types;
    sendfile on;

    server {
        listen 8080;
        server_name _;
        root /srv;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /media/ {
            autoindex off;
            limit_except GET HEAD { deny all; }
            limit_rate 1m;
        }
    }
}
