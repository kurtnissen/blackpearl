name: blackpearl

services:
  blackpearl:
    image: blackpearl:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      BLACKPEARL_DATA_DIR: /var/lib/blackpearl
      BLACKPEARL_DB_PATH: /var/lib/blackpearl/blackpearl.db
      BLACKPEARL_CACHE_DIR: /var/lib/blackpearl/cache
      BLACKPEARL_MOUNT_PATH: /mnt/blackpearl
      BLACKPEARL_HTTP_ADDR: :8080
      BLACKPEARL_LOG_LEVEL: ${BLACKPEARL_LOG_LEVEL:-info}
      BLACKPEARL_STORAGE_MODE: persistent
      BLACKPEARL_CACHE_MAX_BYTES: "0"
    ports:
      - 8080:8080
    volumes:
      - type: bind
        source: ./runtime/data
        target: /var/lib/blackpearl
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/mount
        target: /mnt/blackpearl
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/readyz]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
